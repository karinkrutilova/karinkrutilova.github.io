<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Edit portfolio</title>
    <link href="./config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      .admin-tools {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .admin-tool-link {
        padding: 10px 14px;
        border-radius: 6px;
        color: #fff;
        background: #2867d6;
        font: 600 14px/1.2 system-ui, sans-serif;
        text-decoration: none;
        box-shadow: 0 2px 12px rgba(0, 0, 0, .3);
      }
      .admin-tool-link:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use the portfolio editor.</noscript>
    <nav class="admin-tools" aria-label="Portfolio tools">
      <a class="admin-tool-link" href="./order/">Arrange gallery</a>
      <a class="admin-tool-link" href="./bulk-upload/">Bulk upload images</a>
    </nav>
    <script src="https://unpkg.com/@sveltia/cms@0.208.2/dist/sveltia-cms.js"></script>
  </body>
</html>
