# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.208.2/schema/sveltia-cms.json
backend:
  name: github
  repo: karinkrutilova/portfolio
  branch: main
site_url: https://karinkrutilova.github.io/portfolio/
display_url: https://karinkrutilova.github.io/portfolio/
logo_url: https://karinkrutilova.github.io/portfolio/favicon.svg
media_folder: /src/assets/works
public_folder: /src/assets/works
media_libraries:
  default:
    config:
      slugify_filename: true
asset_collections:
  - name: artwork_images
    label: Artwork images
    icon: image
    media_folder: /src/assets/works
    public_folder: /src/assets/works
collections:
  - name: works
    label: Artwork details
    label_singular: Artwork details
    description: 'Every image uploaded with Bulk upload images has a matching record here. Open one to edit its title, description, accessibility text, ordering, and other optional details.'
    folder: src/content/works
    create: true
    slug: '{{slug}}'
    preview_path: 'works/{{slug}}/'
    summary: '{{title}}'
    sortable_fields: [order, title, year]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: year, label: Year, widget: number, value_type: int, required: false }
      - { name: medium, label: Medium, widget: string, required: false }
      - { name: dimensions, label: Dimensions, widget: string, required: false, hint: 'For example: 40 × 60 cm' }
      - name: image
        label: Image
        widget: image
        hint: 'Choose the matching file from Artwork images. Export around 2000 px on the long edge, ideally under 500 KB.'
      - { name: imageAlt, label: Image description, widget: string, hint: 'Briefly describe what is visible for people using screen readers.' }
      - { name: body, label: Description, widget: markdown, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: featured, label: Featured, widget: boolean, default: false, hint: 'Fallback for artwork not yet positioned with Arrange gallery.' }
      - { name: order, label: Sort order, widget: number, value_type: int, required: false, hint: 'Managed most easily with Arrange gallery. Lower numbers appear first.' }
      - { name: credit, label: Artist credit, widget: string, required: false, hint: 'Only for works by someone else. Leave empty for your own.' }
      - { name: source, label: Source link, widget: string, required: false, pattern: ['^https://', 'Use a full HTTPS URL.'], hint: 'Where a credited work can be seen. Leave empty for your own.' }
  - name: pages
    label: Site text
    files:
      - name: settings
        label: Name and introduction
        file: src/content/settings.json
        fields:
          - { name: name, label: Artist or site name, widget: string }
          - { name: heading, label: Gallery heading, widget: string }
          - { name: intro, label: Short introduction, widget: text }
          - { name: instagram, label: Instagram link, widget: string, required: false, hint: 'Full address, for the footer. Leave empty to hide.' }
          - { name: email, label: Contact email, widget: string, required: false, hint: 'Shown as an Email link in the footer. Leave empty to hide.' }
          - { name: showDetails, label: Show detail close-ups, widget: boolean, default: true, hint: 'Adds a row of automatically chosen close-ups under each work.' }
          - { name: showYear, label: Show years, widget: boolean, default: true, hint: 'Switch everything below off for an art-only gallery.' }
          - { name: showTitle, label: Show titles, widget: boolean, default: false, hint: 'Titles are still needed for page addresses.' }
          - { name: showMedium, label: Show medium and size, widget: boolean, default: false }
          - { name: showDescription, label: Show descriptions, widget: boolean, default: false }
          - { name: showTags, label: Show tags, widget: boolean, default: false }
      - name: about
        label: About and contact
        file: src/content/pages/about.md
        fields:
          - { name: title, label: Page title, widget: string }
          - { name: body, label: About and contact details, widget: markdown }
