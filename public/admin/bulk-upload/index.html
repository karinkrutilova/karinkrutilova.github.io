<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bulk upload portfolio images</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
      body { width: min(720px, calc(100% - 32px)); margin: 48px auto; }
      h1 { line-height: 1.1; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-block: 24px; }
      input { max-width: 100%; }
      button { padding: 9px 14px; border: 1px solid currentColor; border-radius: 5px; font: inherit; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      #status { min-height: 8em; padding: 16px; overflow-wrap: anywhere; white-space: pre-wrap; background: color-mix(in srgb, CanvasText 7%, Canvas); }
      .note { color: color-mix(in srgb, CanvasText 68%, Canvas); }
    </style>
  </head>
  <body>
    <main>
      <a href="../">Back to editor</a>
      <h1>Bulk upload images</h1>
      <p>Select any number of JPG, PNG, WebP, GIF or AVIF files. No artwork fields are required.</p>
      <p class="note">Files are uploaded independently, then published together. Existing filenames are preserved by adding a number to the new file.</p>
      <div class="actions">
        <input id="files" type="file" accept=".avif,.gif,.jpeg,.jpg,.png,.webp,image/avif,image/gif,image/jpeg,image/png,image/webp" multiple />
        <button id="upload" type="button" disabled>Upload selected images</button>
      </div>
      <pre id="status" role="status" aria-live="polite">Choose images to begin.</pre>
    </main>
    <script src="./upload.js"></script>
  </body>
</html>
